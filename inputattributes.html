<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <fieldset style="width:50%;">
        <legend align="center" >loginform</legend>
         <form action=""  align="center">
        <lable for="">name</lable>
        <input type="text" name="" id="" autofocus placeholder="enter your name"><br>
        <lable for="">phone<sup style="color:red;">*</sup></lable>
        <input type="tel" name="" id="" required minlength="10" maxlength="12"><br>
        <lable for="">password1</lable>
        <input type="password"  name="" id="" pattern="[0-9]{5}"><br>
        <lable for="">password2</lable>
        <input type="password"  name="" id="" pattern="[A-Z]{5}"><br>
        <lable for="">disabled</lable>
        <input type="text"  name="" id="" disabled><br>
        <lable for="">hidden</lable>
        <input type="text"  name="" id="" hidden values="qspiders"><br>
        <lable for="">values</lable>
        <input type="text"  name="" id=""  values="web" readonly>
        <input type="submit" name="" id=""  value="register">
        <input type="text" name="" id="" values="web" readonly><br>
        <textarea name="" id="" cols="20" rows="5"></textarea><br>
        <lable for="">stream</lable>
        <select name="" id="">
            <option values="">-select-</option>
            <option values="">cse</option>
            <option values="">ece</option>
        </select><br>
        country: <input type="text" list="a1">
        <datalist id="a1">
            <option values="hyderabad">india</option>
            <option values="calf">us</option>
        </datalist>
        <input type="submit" name="" id="" value="register">
    </form>
</fieldset>
</body>
</html>
